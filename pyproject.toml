[project]
name = "canpeek"
version = "2.0.0-dev"
description = "High-performance CAN/CAN FD bus analyzer with multi-bus support"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Denis Jullien"}
]
keywords = ["can", "can-fd", "canbus", "automotive", "socketcan", "analyzer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

dependencies = [
    "python-can>=4.5.0",
    "cantools>=40.2.3",
    "canopen>=2.3.0",
    "PySide6>=6.9.0",
    "PySide6-QtAds>=4.4.0",
    "qasync>=0.27.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
interfaces = [
    "python-can[pcan,kvaser,vector,nixnet,gs_usb,serial]",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7.0",
    "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/denis-jullien/canpeek2"

[project.scripts]
canpeek = "canpeek.__main__:main"

[project.gui-scripts]
canpeek-gui = "canpeek.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canpeek"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line length handled separately

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
